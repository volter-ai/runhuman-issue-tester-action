name: 'Runhuman Issue Tester'
description: 'Test linked GitHub Issues when PRs are merged using AI-powered human QA testing'
author: 'Runhuman'

branding:
  icon: 'check-square'
  color: 'green'

inputs:
  issue-number:
    description: 'Specific issue number(s) to test, comma-separated (e.g., "123" or "123, 456, 789"). Bypasses filter and auto-detection.'
    required: false
  issue-filter:
    description: 'Filter query for dynamic issue selection (e.g., "state:open stale:30d unassigned"). See README for syntax.'
    required: false
  max-issues:
    description: 'Maximum issues to process when using filter mode (default: 10)'
    required: false
    default: '10'
  test-url:
    description: 'Manual test URL (overrides AI-detected URL from issue)'
    required: false
  api-key:
    description: 'Runhuman API key (starts with qa_live_). Store as secret!'
    required: true
  github-token:
    description: 'GitHub token for API access (defaults to GITHUB_TOKEN)'
    required: false
    default: ${{ github.token }}
  api-url:
    description: 'Runhuman API base URL'
    required: false
    default: 'https://runhuman.com'
  qa-label:
    description: 'Label that marks issues for QA testing'
    required: false
    default: 'qa-test'
  auto-detect:
    description: 'Use AI to detect testable issues without qa-label (labeled issues are always tested)'
    required: false
    default: 'true'
  target-duration-minutes:
    description: 'Target test duration in minutes (1-60)'
    required: false
    default: '5'
  on-not-testable:
    description: 'Actions when issue is not testable. DSL: close, open, add-label:x, remove-label:x, comment'
    required: false
    default: ''
  on-success:
    description: 'Actions when test passes. DSL: close, open, add-label:x, remove-label:x, comment'
    required: false
    default: ''
  on-failure:
    description: 'Actions when test fails. DSL: close, open, add-label:x, remove-label:x, comment'
    required: false
    default: ''
  issue-pattern:
    description: 'Custom regex pattern to detect issue numbers in commit messages (must have a capture group for the issue number)'
    required: false
  test-merges:
    description: 'Test merge commits that have no linked issues (requires test-url)'
    required: false
    default: 'true'
  auto-mode-only-missing-media:
    description: 'Only test issues missing reproduction media (screenshots/videos). AI analyzes issue + comments.'
    required: false
    default: 'false'
  screen-size:
    description: 'Screen size for testing. Use preset (desktop, laptop, tablet, mobile) or custom JSON {"width": 1920, "height": 1080}'
    required: false
    default: 'desktop'

outputs:
  tested-issues:
    description: 'JSON array of tested issue numbers'
  passed-issues:
    description: 'JSON array of issue numbers that passed'
  failed-issues:
    description: 'JSON array of issue numbers that failed'
  skipped-issues:
    description: 'JSON array of issue numbers skipped (no URL or not testable)'
  total-cost-usd:
    description: 'Total cost of all tests in USD'
  results:
    description: 'Full results object as JSON'

runs:
  using: 'node20'
  main: 'dist/index.js'
